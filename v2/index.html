function micTracksLive(stream) {
  if (!stream) return false;
  const tracks = stream.getAudioTracks();
  // readyState only — track.muted can flicker true on iOS at start
  return tracks.length > 0 && tracks.every(tr => tr.readyState === 'live');
}

async function ensureMicStream(forceNew) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw Object.assign(new Error('no media'), { name: 'NotSupportedError' });
  }
  if (forceNew && mediaStream) {
    try { mediaStream.getTracks().forEach(tr => tr.stop()); } catch (e) {}
    mediaStream = null;
  }
  if (mediaStream) {
    if (micTracksLive(mediaStream)) return mediaStream;
    try { mediaStream.getTracks().forEach(tr => tr.stop()); } catch (e) {}
    mediaStream = null;
  }
  if (micWarmPromise) return micWarmPromise;
  micWarmPromise = navigator.mediaDevices.getUserMedia({
    audio: {
      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true
    }
  }).then(stream => {
    mediaStream = stream;
    // Keep tracks alive; if browser ends them, clear cache
    stream.getTracks().forEach(tr => {
      tr.onended = () => {
        if (mediaStream === stream) mediaStream = null;
      };
    });
    return stream;
  }).finally(() => { micWarmPromise = null; });
  return micWarmPromise;
}

function warmMicForSenior() {
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return;
  // Fire-and-forget; permission prompt may appear — that's OK on first open
  ensureMicStream().catch(() => {});
}

async function startHoldRecord(from, ev) {
  if (ev) { ev.preventDefault(); ev.stopPropagation(); }
  if (mediaRecorder && mediaRecorder.state === 'recording') return;
  if (recArming) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    toast(t('toastMicUnavailable'));
    return;
  }
  stopPlaying();
  recCancelled = false;
  recFrom = from;
  recChunks = [];
  recStartedAt = 0;
  holdPressedAt = Date.now();
  // Instant feedback before any mic work (paint before await)
  setHoldUi(from, 'arming');
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  if (recCancelled) { setHoldUi(from, false); return; }
  recArming = (async () => {
    try {
      // iOS Safari: MediaRecorder on a reused/pre-warmed stream often yields an empty blob.
      // Force a fresh getUserMedia each hold on iOS; elsewhere reuse the warm stream.
      await ensureMicStream(!!isIOSLike());
      if (recCancelled) return;
      if (!micTracksLive(mediaStream)) {
        await ensureMicStream(true);
      }
      if (recCancelled) return;
      const mime = pickRecorderMime();
      try {
        mediaRecorder = mime ? new MediaRecorder(mediaStream, { mimeType: mime }) : new MediaRecorder(mediaStream);
      } catch (err) {
        // Retry once with a brand-new stream (stale track after visibility change)
        await ensureMicStream(true);
        if (recCancelled) return;
        try {
          mediaRecorder = mime ? new MediaRecorder(mediaStream, { mimeType: mime }) : new MediaRecorder(mediaStream);
        } catch (err2) {
          setHoldUi(from, false);
          toast(t('toastVoiceFailed'));
          return;
        }
      }
      mediaRecorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
      mediaRecorder.onerror = () => { toast(t('toastVoiceFailed')); };
      mediaRecorder.onstart = () => { if (!recStartedAt) recStartedAt = Date.now(); };
      // timeslice so ondataavailable fires during hold (helps flush on stop)
      try {
        mediaRecorder.start(250);
      } catch (errStart) {
        try { mediaRecorder.start(); } catch (errStart2) {
          setHoldUi(from, false);
          toast(t('toastVoiceFailed'));
          return;
        }
      }
      if (!recStartedAt) recStartedAt = Date.now();
      setHoldUi(from, true);
      clearTimeout(recMaxTimer);
      recMaxTimer = setTimeout(() => stopHoldRecord(from, true), MAX_REC_MS);
      if (recCancelled) { await stopHoldRecord(from, false); }
    } catch (err) {
      setHoldUi(from, false);
      const name = (err && err.name) || '';
      if (name === 'NotAllowedError' || name === 'PermissionDeniedError') toast(t('toastMicDenied'));
      else toast(t('toastMicUnavailable'));
    } finally {
      recArming = null;
    }
  })();
  await recArming;
}

function stopMediaTracks(force) {
  // By default keep the mic stream warm for the next hold-to-talk (iOS Safari latency).
  if (!force) return;
  if (mediaStream) {
    mediaStream.getTracks().forEach(tr => { try { tr.stop(); } catch (e) {} });
    mediaStream = null;
  }
}

async function stopHoldRecord(from, auto) {
  clearTimeout(recMaxTimer);
  const btnFrom = from || recFrom;
  const pressedAt = holdPressedAt || Date.now();
  // If still arming mic, wait for start — don't discard solely due to startup latency
  if (recArming && !(mediaRecorder && mediaRecorder.state === 'recording')) {
    recCancelled = true;
    try { await recArming; } catch (e) {}
  }
  setHoldUi(btnFrom || 'elder', false);
  const mr = mediaRecorder;
  if (!mr || mr.state === 'inactive') {
    mediaRecorder = null;
    // Mic never started — only tip if the press itself was a short tap
    const holdDurEarly = Date.now() - pressedAt;
    if (!auto && holdDurEarly >= MIN_HOLD_ACCEPT_MS) {
      stopMediaTracks(true);
      toast(t('toastVoiceFailed'));
    }
    return;
  }
  const started = recStartedAt || pressedAt;
  const who = recFrom;
  const mime = mr.mimeType || pickRecorderMime() || (isIOSLike() ? 'audio/mp4' : 'audio/webm');
  const blob = await new Promise(resolve => {
    let settled = false;
    const finish = () => {
      if (settled) return;
      settled = true;
      resolve(new Blob(recChunks, { type: mime }));
    };
    mr.ondataavailable = e => {
      if (e.data && e.data.size) recChunks.push(e.data);
    };
    mr.onstop = finish;
    // Flush buffered data before stop (critical on iOS Safari), then stop
    try {
      if (mr.state === 'recording' && typeof mr.requestData === 'function') mr.requestData();
    } catch (e) {}
    try { mr.stop(); } catch (e) { finish(); }
    // Safety: some WebKit builds never fire onstop after empty record
    setTimeout(finish, 800);
  });
  mediaRecorder = null;
  recChunks = [];
  // Measure from actual recorder start, not finger-down (arming latency)
  const stopAt = Date.now();
  const recDur = Math.max(0, stopAt - started);
  const holdDur = Math.max(0, stopAt - pressedAt);
  const genuinelyShortHold = holdDur < MIN_HOLD_ACCEPT_MS;
  if (!blob || blob.size < MIN_BLOB_BYTES) {
    // Empty blob after a long hold = recorder/stream failure (common on iOS reused stream).
    // Invalidate mic so the next hold re-acquires getUserMedia.
    stopMediaTracks(true);
    if (genuinelyShortHold) toast(t('toastVoiceTooShort'));
    else toast(t('toastVoiceFailed'));
    return;
  }
  if (recDur < MIN_REC_MS && genuinelyShortHold) {
    toast(t('toastVoiceTooShort'));
    return;
  }
  // On iOS, drop the stream after each clip so the next MediaRecorder gets a fresh track
  if (isIOSLike()) stopMediaTracks(true);
  const dur = Math.max(recDur, Math.min(holdDur, MAX_REC_MS));
  try {
    const dataUrl = await blobToDataUrl(blob);
    await saveVoiceMessage(who, dataUrl, dur);
  } catch (e) {
    console.warn(e);
    toast(t('toastVoiceFailed'));
  }
}

function cancelHoldRecord(from) {
  clearTimeout(recMaxTimer);
  recCancelled = true;
  setHoldUi(from || recFrom || 'elder', false);
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    try { mediaRecorder.onstop = null; mediaRecorder.stop(); } catch (e) {}
  }
  mediaRecorder = null;
  recChunks = [];
  // keep mediaStream warm
}

async function saveVoiceMessage(from, dataUrl, durationMs) {
  const elder = getActiveElder();
  if (!elder) return;
  const id = 'v' + Date.now() + Math.random().toString(36).slice(2, 7);
  await idbPutAudio(id, dataUrl);
  const msg = {
    id,
    from,
    elderId: elder.id,
    durationMs,
    at: now(),
    readByElder: from === 'elder',
    readByFamily: from === 'family'
  };
  if (!state.messages) state.messages = [];
  state.messages.unshift(msg);
  trimMessages();
  if (from === 'elder') {
    applyCheckIn(true);
    toast(t('toastVoiceCheckin'));
  } else {
    toast(t('toastVoiceSent'));
  }
  saveState();
  if (role === 'family' && familyTab === 'messages' && from === 'family') familyMsgPane = 'thread';
  render();
  if (role === 'family' && familyTab === 'messages' && familyMsgPane === 'thread') {
    const thread = document.getElementById('chatThread');
    if (thread) thread.scrollTop = thread.scrollHeight;
  }
}

function bindHoldButton(el, from) {
  if (!el || el.dataset.bound === '1') return;
  el.dataset.bound = '1';
  let lastTouchAt = 0;
  const onStart = e => startHoldRecord(from, e);
  const onEnd = e => {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    stopHoldRecord(from, false);
  };
  // Pointer Events (iOS 13+) — avoids touch+mouse double-fire on iOS Safari
  if (window.PointerEvent) {
    el.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && (Date.now() - lastTouchAt) < 700) return;
      if (e.pointerType === 'touch' || e.pointerType === 'pen') lastTouchAt = Date.now();
      try { el.setPointerCapture && e.pointerId != null && el.setPointerCapture(e.pointerId); } catch (err) {}
      onStart(e);
    });
    el.addEventListener('pointerup', onEnd);
    el.addEventListener('pointercancel', e => {
      e.preventDefault();
      // iOS may fire pointercancel during a long hold; save if we actually recorded
      const held = recStartedAt ? (Date.now() - recStartedAt) : (Date.now() - (holdPressedAt || Date.now()));
      if (mediaRecorder && mediaRecorder.state === 'recording' && recFrom === from && held >= MIN_HOLD_ACCEPT_MS) {
        stopHoldRecord(from, false);
      } else {
        cancelHoldRecord(from);
      }
    });
    el.addEventListener('lostpointercapture', () => {
      if (mediaRecorder && mediaRecorder.state === 'recording' && recFrom === from) stopHoldRecord(from, false);
    });
  } else {
    el.addEventListener('touchstart', e => { lastTouchAt = Date.now(); onStart(e); }, { passive: false });
    el.addEventListener('touchend', onEnd, { passive: false });
    el.addEventListener('touchcancel', e => {
      e.preventDefault();
      const held = recStartedAt ? (Date.now() - recStartedAt) : (Date.now() - (holdPressedAt || Date.now()));
      if (mediaRecorder && mediaRecorder.state === 'recording' && recFrom === from && held >= MIN_HOLD_ACCEPT_MS) {
        stopHoldRecord(from, false);
      } else {
        cancelHoldRecord(from);
      }
    }, { passive: false });
    el.addEventListener('mousedown', e => {
      if (Date.now() - lastTouchAt < 700) return;
      onStart(e);
    });
    el.addEventListener('mouseup', e => {
      if (Date.now() - lastTouchAt < 700) return;
      onEnd(e);
    });
    el.addEventListener('mouseleave', () => {
      if (mediaRecorder && mediaRecorder.state === 'recording' && recFrom === from) stopHoldRecord(from, false);
    });
  }
  el.addEventListener('contextmenu', e => e.preventDefault());
}

// Drop cached mic if the page was backgrounded and tracks died (common on iOS)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (mediaStream && !micTracksLive(mediaStream)) {

  if (_bootDone && cloudReady) {

  }
});

});

let callVideoTrack = null;
let autoAnswerTimer = null;
let autoAnswerTick = null;
let callUiMode = null; // outgoing | incoming | incall

function getCallOverlay() { return document.getElementById('callOverlay'); }

function clearAutoAnswerTimers() {
  clearTimeout(autoAnswerTimer);
  clearInterval(autoAnswerTick);
  autoAnswerTimer = null;
  autoAnswerTick = null;
}

function stopCallMedia() {
  if (callStream) {
    callStream.getTracks().forEach(tr => { try { tr.stop(); } catch (e) {} });
  }
  callStream = null;
  callAudioTrack = null;
  callVideoTrack = null;
  const vid = document.getElementById('selfPreview');
  if (vid) vid.srcObject = null;
}

function hangUpCall(silent) {
  clearAutoAnswerTimers();
  if (typeof clearElderCallTimers === 'function') clearElderCallTimers();
  stopCallMedia();
  state.activeCall = null;
  callUiMode = null;
  saveState();
  const ov = getCallOverlay();
  if (ov) { ov.classList.add('hidden'); ov.innerHTML = ''; }
  if (!silent) toast(t('callEnded'));
  render();
}

function startVideoCall(elderId) {
  const elder = (elderId && state.elders.find(e => e.id === elderId)) || getActiveElder();
  if (!elder) return;
  state.activeElderId = elder.id;
  state.activeCall = {
    elderId: elder.id,
    status: 'ringing',
    from: 'family',
    at: now()
  };
  saveState();
  showOutgoingCall(elder);
  toast(t('toastCallStarted'));
  // Demo: after a moment, flip to senior incoming if still ringing
  setTimeout(() => {
    if (!state.activeCall || state.activeCall.status !== 'ringing') return;
    state.activeElderId = state.activeCall.elderId;
    saveState();
    if (role !== 'elder') setRole('elder');
    else showIncomingCall(elder);
  }, 1400);
}

function showOutgoingCall(elder) {
  callUiMode = 'outgoing';
  const ov = getCallOverlay();
  ov.classList.remove('hidden');
  ov.className = 'call-overlay';
  ov.innerHTML = `
    <div>
      <div class="call-avatar">👵</div>
      <div class="call-name">${escapeHtml(elderTitle(elder))}</div>
      <div class="call-status">${escapeHtml(t('callCalling'))}</div>
      <p class="muted" style="color:#94a3b8;text-align:center;margin-top:16px;font-size:0.85rem">${escapeHtml(t('callRemoteDemo'))}</p>
    </div>
    <div class="call-actions">
      <button type="button" class="call-btn hangup" onclick="hangUpCall()"><span class="ico">📞</span>${escapeHtml(t('callDecline'))}</button>
    </div>`;
}

function showIncomingCall(elder) {
  if (!state.activeCall || state.activeCall.status !== 'ringing') return;
  // Route to the senior being called
  const target = state.elders.find(e => e.id === state.activeCall.elderId) || elder || getActiveElder();
  if (!target) return;
  elder = target;
  state.activeElderId = target.id;
  callUiMode = 'incoming';
  role = 'elder';
  saveState();
  syncRoleTabs();
  document.getElementById('elderView').classList.remove('hidden');
  document.getElementById('familyView').classList.add('hidden');
  document.getElementById('familyTabs').classList.add('hidden');
  fillWhoAmISelect();

  const ov = getCallOverlay();
  ov.classList.remove('hidden');
  ov.className = 'call-overlay';
  const auto = !!state.autoAnswerCalls;
  ov.innerHTML = `
    <div>
      <div class="call-avatar">👨‍👩‍👧</div>
      <div class="call-name">${escapeHtml(t('callIncoming'))}</div>
      <div class="call-status">${escapeHtml(t('callFromFamily'))} → ${escapeHtml(elderTitle(elder))}</div>
      <div class="call-countdown" id="autoAnswerCountdown"></div>
    </div>
    <div class="call-actions">
      <button type="button" class="call-btn decline" onclick="declineCall()"><span class="ico">📵</span>${escapeHtml(t('callDecline'))}</button>
      <button type="button" class="call-btn answer" onclick="answerCall()"><span class="ico">📹</span>${escapeHtml(t('callAnswer'))}</button>
    </div>`;

  clearAutoAnswerTimers();
  if (auto) {
    let left = 3;
    const cd = document.getElementById('autoAnswerCountdown');
    if (cd) cd.textContent = t('callAutoIn') + left + '…';
    autoAnswerTick = setInterval(() => {
      left -= 1;
      const el = document.getElementById('autoAnswerCountdown');
      if (el) el.textContent = left > 0 ? (t('callAutoIn') + left + '…') : t('callConnecting');
      if (left <= 0) clearInterval(autoAnswerTick);
    }, 1000);
    autoAnswerTimer = setTimeout(() => answerCall(), 3000);
  }
}

function declineCall() {
  clearAutoAnswerTimers();
  state.activeCall = null;
  saveState();
  const ov = getCallOverlay();
  ov.classList.add('hidden');
  ov.innerHTML = '';
  callUiMode = null;
  toast(t('toastCallDeclined'));
  render();
}

async function answerCall() {
  clearAutoAnswerTimers();
  if (!state.activeCall) return;
  state.activeCall.status = 'connected';
  saveState();
  applyCheckIn(true);
  toast(t('toastCallAnswered'));
  await showInCall();
}

async function showInCall() {
  callUiMode = 'incall';
  const elder = getActiveElder();
  const outContact = (state.activeCall && state.activeCall.from === 'elder') ? currentCallContact() : null;
  const ov = getCallOverlay();
  ov.classList.remove('hidden');
  ov.className = 'call-overlay in-call';
  ov.innerHTML = `
    <div style="width:100%;text-align:center;font-weight:800;font-size:1.1rem">${escapeHtml(outContact ? outContact.name : (elder ? elder.name : ''))}</div>
    <div class="in-call-stage">
      <div class="remote">
        <div class="big">👤</div>
        <div class="label">${escapeHtml(t('callRemoteDemo'))}</div>
      </div>
      <video id="selfPreview" class="self" playsinline webkit-playsinline autoplay muted></video>
    </div>
    <div class="in-call-bar">
      <button type="button" class="call-btn mute" id="btnCallMute" onclick="toggleCallMute()"><span class="ico">🔇</span><span id="lblCallMute">${escapeHtml(t('callMute'))}</span></button>
      <button type="button" class="call-btn hangup" onclick="hangUpCall()"><span class="ico">📞</span>${escapeHtml(t('callHangup'))}</button>
      <button type="button" class="call-btn cam" id="btnCallCam" onclick="toggleCallCam()"><span class="ico">📷</span><span id="lblCallCam">${escapeHtml(t('callCamOff'))}</span></button>
    </div>`;

  stopCallMedia();
  try {
    callStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    callAudioTrack = callStream.getAudioTracks()[0] || null;
    callVideoTrack = callStream.getVideoTracks()[0] || null;
    const vid = document.getElementById('selfPreview');
    if (vid) {
      vid.srcObject = callStream;
      try { await vid.play(); } catch (e) {}
    }
  } catch (err) {
    const name = (err && err.name) || '';
    toast(t('toastCamDenied'));
    const vid = document.getElementById('selfPreview');
    if (vid) {
      vid.style.background = '#334155';
      vid.insertAdjacentHTML('afterend', '');
    }
  }
}

function toggleCallMute() {
  if (!callAudioTrack) return;
  callAudioTrack.enabled = !callAudioTrack.enabled;
  const btn = document.getElementById('btnCallMute');
  const lbl = document.getElementById('lblCallMute');
  const muted = !callAudioTrack.enabled;
  if (lbl) lbl.textContent = muted ? t('callUnmute') : t('callMute');
  if (btn) btn.classList.toggle('active-off', muted);
}

function toggleCallCam() {
  if (!callVideoTrack) return;
  callVideoTrack.enabled = !callVideoTrack.enabled;
  const btn = document.getElementById('btnCallCam');
  const lbl = document.getElementById('lblCallCam');
  const off = !callVideoTrack.enabled;
  if (lbl) lbl.textContent = off ? t('callCamOn') : t('callCamOff');
  if (btn) btn.classList.toggle('active-off', off);
}

function restoreCallUiIfNeeded() {
  const call = state.activeCall;
  if (!call) return;
  const elder = state.elders.find(e => e.id === call.elderId) || getActiveElder();
  if (!elder) return;
  if (call.from === 'elder' && call.status === 'dialing') {
    showElderOutgoing();
    return;
  }
  if (call.status === 'ringing') {
    if (role === 'family') showOutgoingCall(elder);
    else showIncomingCall(elder);
  } else if (call.status === 'connected') {
    showInCall();
  }
}


/* ===== SOS press-and-hold (2s) ===== */
const SOS_HOLD_MS = 2000;
const SOS_RING_LEN = 2 * Math.PI * 44;
let sosHoldStart = 0;
let sosHoldRaf = null;
let sosHoldFired = false;

function setSosProgress(p) {
  const fg = document.getElementById('sosRingFg');
  if (fg) fg.style.strokeDashoffset = String(SOS_RING_LEN * (1 - Math.max(0, Math.min(1, p))));
}

function cancelSosHold() {
  if (sosHoldRaf) cancelAnimationFrame(sosHoldRaf);
  sosHoldRaf = null;
  sosHoldStart = 0;
  const btn = document.getElementById('sosBtn');
  if (btn) btn.classList.remove('holding');
  setSosProgress(0);
}

function sosTick() {
  if (!sosHoldStart) return;
  const p = (performance.now() - sosHoldStart) / SOS_HOLD_MS;
  setSosProgress(p);
  if (p >= 1) {
    sosHoldFired = true;
    cancelSosHold();
    if (navigator.vibrate) { try { navigator.vibrate(200); } catch (e) {} }
    doSOS();
    return;
  }
  sosHoldRaf = requestAnimationFrame(sosTick);
}

function bindSosHold() {
  const btn = document.getElementById('sosBtn');
  if (!btn || btn.dataset.bound === '1') return;
  btn.dataset.bound = '1';
  const fg = document.getElementById('sosRingFg');
  if (fg) { fg.style.strokeDasharray = String(SOS_RING_LEN); fg.style.strokeDashoffset = String(SOS_RING_LEN); }
  const start = (e) => {
    e.preventDefault();
    sosHoldFired = false;
    cancelSosHold();
    btn.classList.add('holding');
    sosHoldStart = performance.now();
    try { btn.setPointerCapture && e.pointerId != null && btn.setPointerCapture(e.pointerId); } catch (err) {}
    sosHoldRaf = requestAnimationFrame(sosTick);
  };
  const end = () => { if (!sosHoldFired) cancelSosHold(); };
  btn.addEventListener('pointerdown', start);
  btn.addEventListener('pointerup', end);
  btn.addEventListener('pointercancel', end);
  btn.addEventListener('lostpointercapture', end);
  // Do not cancel on pointerleave — finger drift would abort SOS for seniors
  btn.addEventListener('contextmenu', e => e.preventDefault());
  // Keyboard: hold Space/Enter
  btn.addEventListener('keydown', e => {
    if ((e.key === ' ' || e.key === 'Enter') && !sosHoldStart) start(e);
  });
  btn.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') end(); });
}

/* ===== Senior → family video call (priority cascade, demo) ===== */
const ELDER_CALL_NOANSWER_MS = 10000;
let elderCallTimer = null;
let elderCallTick = null;

function clearElderCallTimers() {
  clearTimeout(elderCallTimer);
  clearInterval(elderCallTick);
  elderCallTimer = null;
  elderCallTick = null;
}

function startElderVideoCall() {
  if (!state.contacts.length) { toast(t('toastNoContacts')); return; }
  const elder = getActiveElder();
  if (!elder) return;
  // Pressing call is a sign of life → counts as check-in
  applyCheckIn(true);
  state.activeCall = { elderId: elder.id, from: 'elder', status: 'dialing', contactIdx: 0, at: now() };
  saveState();
  showElderOutgoing();
}

function currentCallContact() {
  const c = state.activeCall;
  if (!c || c.from !== 'elder') return null;
  return state.contacts[c.contactIdx] || null;
}

function showElderOutgoing() {
  const call = state.activeCall;
  const contact = currentCallContact();
  if (!call || !contact) return;
  clearElderCallTimers();
  callUiMode = 'outgoing';
  const total = state.contacts.length;
  const ov = getCallOverlay();
  ov.classList.remove('hidden');
  ov.className = 'call-overlay';
  ov.innerHTML = `
    <div style="width:100%">
      <div class="call-avatar">👨‍👩‍👧</div>
      <div class="call-name" id="elderCallName">${escapeHtml(contact.name)}</div>
      <div class="call-status">${escapeHtml(t('callCalling'))} · ${escapeHtml(t('callPriority'))} ${call.contactIdx + 1} ${escapeHtml(t('callOf'))} ${total}</div>
      <div class="call-countdown" id="elderCallCountdown" style="text-align:center;margin-top:10px;opacity:.8"></div>
      <p style="color:#94a3b8;text-align:center;margin-top:12px;font-size:0.85rem">${escapeHtml(t('callRemoteDemo'))}</p>
    </div>
    <div style="width:100%;display:flex;flex-direction:column;gap:18px;align-items:center">
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button type="button" class="btn btn-secondary" id="btnDemoNoAnswer" onclick="elderCallNoAnswer()">${escapeHtml(t('callNoAnswerDemo'))}</button>
        <button type="button" class="btn btn-primary" id="btnDemoAnswer" onclick="elderCallAnswered()">${escapeHtml(t('callSimulateAnswer'))}</button>
      </div>
      <div class="call-actions">
        <button type="button" class="call-btn hangup" onclick="hangUpCall()"><span class="ico">📞</span>${escapeHtml(t('callHangup'))}</button>
      </div>
    </div>`;
  let left = Math.round(ELDER_CALL_NOANSWER_MS / 1000);
  const cd = () => {
    const el = document.getElementById('elderCallCountdown');
    if (el) el.textContent = left + 's';
  };
  cd();
  elderCallTick = setInterval(() => { left -= 1; if (left >= 0) cd(); }, 1000);
  elderCallTimer = setTimeout(() => elderCallNoAnswer(), ELDER_CALL_NOANSWER_MS);
}

function elderCallNoAnswer() {
  const call = state.activeCall;
  if (!call || call.from !== 'elder' || call.status !== 'dialing') return;
  clearElderCallTimers();
  if (call.contactIdx + 1 < state.contacts.length) {
    call.contactIdx += 1;
    saveState();
    toast(t('toastTryingNext'));
    showElderOutgoing();
  } else {
    toast(t('toastNoAnswerAll'));
    hangUpCall(true);
  }
}

async function elderCallAnswered() {
  const call = state.activeCall;
  if (!call || call.from !== 'elder') return;
  clearElderCallTimers();
  call.status = 'connected';
  saveState();
  toast(t('toastCallAnswered'));
  await showInCall();
}


/* ===== Cloud bridge (two-phone sync) ===== */
let cloud = null;
let cloudReady = false;
let cloudUnsub = null;
let _pullTail = Promise.resolve();
let _bootDone = false;

function setCloudBadge(text, isErr) {
  const el = document.getElementById('cloudBadge');
  if (!el) return;
  if (!text) { el.classList.add('hidden'); return; }
  el.textContent = text;
  el.classList.toggle('err', !!isErr);
  el.classList.remove('hidden');
}

function showPairGate(mode) {
  const gate = document.getElementById('pairGate');
  if (!gate) return;
  gate.classList.remove('hidden');
  document.getElementById('pairGateTitle').textContent = t('pairGateTitle');
  document.getElementById('pairGateSub').textContent = t('pairGateSub');
  document.getElementById('btnPairFamily').textContent = t('pairIAmFamily');
  document.getElementById('btnPairSenior').textContent = t('pairIAmSenior');
  document.getElementById('pairEnterCode').textContent = t('pairEnterCode');
  document.getElementById('pairCodeHelp').textContent = t('pairCodeHelp');
  document.getElementById('btnPairCode').textContent = t('pairCodeBtn');
  const choose = document.getElementById('pairGateChoose');
  const code = document.getElementById('pairGateCode');
  if (mode === 'code') {
    choose.classList.add('hidden');
    code.classList.remove('hidden');
  } else {
    choose.classList.remove('hidden');
    code.classList.add('hidden');
  }
}

function hidePairGate() {
  const gate = document.getElementById('pairGate');
  if (gate) gate.classList.add('hidden');
}

function mapStateFromCloud(remote) {
  state = PresokCloud.mapRemoteToState(remote, state);
  lang = state.lang || lang || 'en';
  role = state.role || role;
  if (state.membershipRole === 'elder') {
    role = 'elder';
    state.activeElderId = state.membershipElderId || state.activeElderId;
  }
}

async function pullCloudState(opts) {
  if (!cloud) return;
  // Serialize pulls so realtime + explicit refresh never drop each other.
  // Every caller awaits a full getState→map that runs after prior pulls finish.
  const run = async () => {
    try {
      if (!(opts && opts.silent)) setCloudBadge(t('cloudSyncing'));
      const remote = await cloud.getState();
      if (!remote.household) return remote;
      mapStateFromCloud(remote);
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      try { considerNewIncomingMessages(state.messages || []); } catch (e) {}
      try { considerNewMedNotifications(state.notifications || []); } catch (e) {}
      if (cloudReady) {
        applyI18n();
        render();
        try { updateMedOverlay(); } catch (e) {}
        if (role === 'family' && familyTab === 'medicine') {
          try { renderMedicineTab(); } catch (e) {}
        }
      }
      setCloudBadge(t('cloudLive'));
      return remote;
    } catch (err) {
      console.warn(err);
      setCloudBadge(t('cloudError'), true);
      throw err;
    }
  };
  const p = _pullTail.then(run, run);
  _pullTail = p.then(() => {}, () => {});
  return p;
}


// Expose for Playwright / debugging
window.PresokApp = {
  get cloudReady() { return cloudReady; },
  get cloud() { return cloud; },
  get state() { return state; },
  get role() { return role; },
  pullCloudState,
  refreshPairCode,
  playMsgChime,
  notifyIncomingVoice,
  considerNewIncomingMessages,
  isMsgChimeEnabled,
  resetMsgChimeKnown,
  get knownMsgIds() { return _knownMsgIds; },
  updateMedOverlay,
  confirmMedTaken,
  renderMedicineTab,
  considerNewMedNotifications,
  resetMedNotifKnown,
  get medOverlayDoseId() { return _medOverlayDoseId; },
  refreshMedsFromCloud,
  startCloudMedSync,
  onCloudRealtimeEvent,
};
async function bootCloud() {
  cloud = PresokCloud.createCloud(PRESK_CONFIG);
  if (!cloud) {
    setCloudBadge(t('pairOffline'), true);
    showPairGate('choose'); // still allow offline continue
    // auto-hide if already have local data? keep gate so user picks
    return;
  }
  try {
    const init = await cloud.init();
    if (init.restored && init.device && (init.device.householdId || init.device.role)) {
      const remote = await pullCloudState({ silent: true });
      if (remote && remote.household) {
        cloudReady = true;
        hidePairGate();
        if (cloudUnsub) cloudUnsub();
        cloudUnsub = cloud.subscribe((type, payload) => { onCloudRealtimeEvent(type, payload); });
        startCloudMedSync();
        maybeBrowserNotifySetup();
        finishBootUi();
        return;
      }
    }
  } catch (e) {
    console.warn('cloud init', e);
  }
  showPairGate('choose');
}

async function startAsFamily() {
  const status = document.getElementById('pairGateStatus');
  try {
    if (!cloud) throw new Error('no cloud');
    status.textContent = t('pairFamilyCreating');
    await cloud.signInAnonymous();
    const h = await cloud.createHousehold('My family');
    cloud.persistDevice({ role: 'family', householdId: h.id });
    await pullCloudState();
    cloudReady = true;
    if (cloudUnsub) cloudUnsub();
    cloudUnsub = cloud.subscribe((type, payload) => { onCloudRealtimeEvent(type, payload); });
    startCloudMedSync();
    hidePairGate();
    maybeBrowserNotifySetup();
    toast(t('pairConnected'));
    finishBootUi();
  } catch (e) {
    console.error(e);
    status.textContent = t('cloudError') + ' ' + (e.message || '');
  }
}

async function startAsSeniorWithCode() {
  const input = document.getElementById('pairCodeInput');
  const status = document.getElementById('pairGateStatus');
  const code = (input.value || '').replace(/\D/g, '');
  if (code.length !== 6) { status.textContent = t('pairInvalid'); return; }
  try {
    if (!cloud) throw new Error('no cloud');
    status.textContent = t('cloudSyncing');
    await cloud.signInAnonymous();
    const paired = await cloud.pairWithCode(code);
    cloud.persistDevice({ role: 'elder', householdId: paired.household_id, elderId: paired.elder_id });
    await pullCloudState();
    cloudReady = true;
    if (cloudUnsub) cloudUnsub();
    cloudUnsub = cloud.subscribe((type, payload) => { onCloudRealtimeEvent(type, payload); });
    startCloudMedSync();
    hidePairGate();
    maybeBrowserNotifySetup();
    toast(t('pairConnected'));
    finishBootUi();
  } catch (e) {
    console.error(e);
    const msg = (e && (e.message || e.error_description || e.details)) || '';
    // Map known server errors; keep a clear fallback for anything else
    if (/invalid or expired code/i.test(msg) || /code must be 6/i.test(msg)) {
      status.textContent = t('pairInvalid');
    } else if (/too many pairing attempts/i.test(msg)) {
      status.textContent = msg;
    } else if (msg) {
      status.textContent = t('pairInvalid') + ' (' + msg + ')';
    } else {
      status.textContent = t('pairInvalid');
    }
  }
}

function continueOffline() {
  PresokCloud.clearDevice();
  cloud = null;
  cloudReady = false;
  hidePairGate();
  setCloudBadge(t('pairOffline'), true);
  // keep existing local demo state
  finishBootUi();
}

let _lastFamilySweepAt = 0;
async function maybeSweepMissedForFamily() {
  if (!cloud || !cloudReady) return;
  if (state.membershipRole !== 'family') return;
  if (typeof cloud.sweepMyHouseholdMissed !== 'function') return;
  const nowMs = Date.now();
  // At most once per 2 minutes (fallback when pg_cron is not scheduled)
  if (nowMs - _lastFamilySweepAt < 120000) return;
  _lastFamilySweepAt = nowMs;
  try {
    const res = await cloud.sweepMyHouseholdMissed();
    const careN = res && Number(res.alerts_created || 0);
    const medN = res && Number(res.med_alerts_created || 0);
    if (careN > 0 || medN > 0) {
      await pullCloudState({ silent: true });
      const newest = (state.notifications || [])[0];
      if (newest && ((newest.kind || '').startsWith('care') || newest.kind === 'medMissed')) {
        browserNotify('Presok', newest.message);
      }
    }
  } catch (e) {
    console.warn('family sweep', e);
  }
}

function finishBootUi() {
  if (state.membershipRole === 'elder') {
    // Lock to senior view — hide family tab switch
    const sw = document.querySelector('.role-switch');
    if (sw) sw.classList.add('hidden');
    const who = document.getElementById('whoAmIBar');
    if (who) who.classList.add('hidden');
    role = 'elder';
  } else if (cloudReady && state.membershipRole === 'family') {
    // Family phone defaults to family view
    role = 'family';
  }
  applyI18n();
  render();
  restoreCallUiIfNeeded();
  _bootDone = true;
  try { if (role === 'elder') warmMicForSenior(); } catch (e) {}
  try { maybeSweepMissedForFamily(); } catch (e) {}
  try { maybeEnsureMedDoses().then(() => { try { updateMedOverlay(); } catch (e) {} }); } catch (e) {}
  try { startCloudMedSync(); } catch (e) {}
}

function maybeBrowserNotifySetup() {
  try {
    if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
      Notification.requestPermission().catch(() => {});
    }
  } catch (e) {}
}

function browserNotify(title, body) {
  try {
    if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    new Notification(title || 'Presok', { body: body || '', tag: 'presok-alert' });
  } catch (e) {}
}

// Wire gate buttons once
(function bindPairGate() {
  const bf = document.getElementById('btnPairFamily');
  const bs = document.getElementById('btnPairSenior');
  const bl = document.getElementById('btnPairLocal');
  const bc = document.getElementById('btnPairCode');
  const bb = document.getElementById('btnPairBack');
  if (bf) bf.onclick = () => startAsFamily();
  if (bs) bs.onclick = () => showPairGate('code');
  if (bl) bl.onclick = () => continueOffline();
  if (bc) bc.onclick = () => startAsSeniorWithCode();
  if (bb) bb.onclick = () => showPairGate('choose');
  const input = document.getElementById('pairCodeInput');
  if (input) input.addEventListener('keydown', e => { if (e.key === 'Enter') startAsSeniorWithCode(); });
})();

// ---- Override mutations when cloud is active ----
const _applyCheckInLocal = applyCheckIn;
applyCheckIn = function(silent) {
  if (!cloud || !cloudReady) return _applyCheckInLocal(silent);
  const elder = getActiveElder();
  if (!elder) return;
  cloud.doCheckIn(elder.id).then(() => pullCloudState({ silent: true })).then(() => {
    if (!silent) toast(t('toastCheckin'));
  }).catch(e => { console.warn(e); toast(t('cloudError')); });
};

const _doCheckInLocal = doCheckIn;
doCheckIn = function() {
  if (!cloud || !cloudReady) return _doCheckInLocal();
  applyCheckIn(false);
};

const _addElderLocal = addElder;
addElder = async function() {
  if (!cloud || !cloudReady) return _addElderLocal();
  const input = document.getElementById('newElderName');
  const name = (input.value || '').trim();
  if (!name) return;
  try {
    const e = await cloud.addElder(state.householdId, name, null);
    input.value = '';
    await pullCloudState();
    toast(t('toastAdded') + ' · ' + (e.pairing_code || ''));
    try {
      const panel = document.getElementById('pairingPanel');
      if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (err) {}
  } catch (err) {
    console.warn(err);
    toast(t('cloudError'));
  }
};

const _deleteElderLocal = deleteElder;
deleteElder = async function(id) {

  if (!confirm(t('confirmDelete'))) return;
  try {
    await cloud.deleteElder(id);
    await pullCloudState();
    toast(t('toastDeleted'));
  } catch (e) { toast(t('cloudError')); }
};

async function refreshPairCode(elderId) {

const _addContactLocal = addContact;

const _deleteContactLocal = deleteContact;
deleteContact = async function(id) {

const _moveContactLocal = moveContact;

const _clearNotifsLocal = clearNotifs;

const _saveThresholdLocal = saveThreshold;

    await pullCloudState({ silent: true });

const _saveCareReplyLocal = saveCareReply;

  const v = parseFloat(document.getElementById('careReplySelect').value);
  state.careReplyHours = v;
  try {

    toast(t('toastSaved'));

  } catch (e) { toast(t('cloudError')); }
};

const _saveAutoAnswerLocal = saveAutoAnswer;
saveAutoAnswer = async function() {

  try {
    await cloud.updateHousehold({ id: state.householdId, threshold_hours: state.thresholdHours, care_reply_hours: state.careReplyHours, auto_answer_calls: state.autoAnswerCalls });

};

const _confirmSOSLocal = confirmSOS;
confirmSOS = async function() {
  if (!cloud || !cloudReady) return _confirmSOSLocal();
  const elder = getActiveElder();
  closeModal();
  if (!elder) return;
  try {
    await cloud.sos(elder.id);
    await pullCloudState();
    toast(t('sosSent'));
    browserNotify('Presok SOS', elder.name + ' pressed SOS');

};

const _saveVoiceLocal = saveVoiceMessage;
saveVoiceMessage = async function(from, dataUrl, durationMs) {
  if (!cloud || !cloudReady) return _saveVoiceLocal(from, dataUrl, durationMs);
  const elder = getActiveElder();
  if (!elder) return;
  try {
    // dataUrl → blob
    const res = await fetch(dataUrl);
    const blob = await res.blob();
    await cloud.sendVoice(elder.id, from, blob, durationMs);
    // also cache locally for instant playback
    // pull will refresh list
    if (from === 'elder') toast(t('toastVoiceCheckin'));
    else toast(t('toastVoiceSent'));
    await pullCloudState();
    if (role === 'family' && familyTab === 'messages') familyMsgPane = 'thread';
    render();
  } catch (e) {
    console.warn(e);
    toast(t('cloudError'));
  }
};

const _markReadLocal = markMessagesRead;
markMessagesRead = function(viewer) {
  if (!cloud || !cloudReady) return _markReadLocal(viewer);
  const elder = getActiveElder();
  if (!elder) return;
  cloud.markMessagesRead(elder.id, viewer).then(() => pullCloudState({ silent: true })).catch(() => {});
};

const _playVoiceLocal = playVoice;
playVoice = async function(id, btn) {
  /* presok-playback-ui-v34 */
  if (!cloud || !cloudReady) return _playVoiceLocal(id, btn);
  if (playingId === id) { stopPlaying(); return; }
  const msg = (state.messages || []).find(m => m.id === id);
  if (!msg) return;
  stopPlaying();
  if (role === 'elder' && !msg.readByElder) { msg.readByElder = true; saveState(); }
  if (role === 'family' && !msg.readByFamily) { msg.readByFamily = true; saveState(); }
  try {
    let url = null;
    if (msg.storagePath) url = await cloud.voiceUrl(msg.storagePath);
    if (!url) return _playVoiceLocal(id, btn);
    const audio = new Audio(url);
    try {
      await beginPlayback(audio, id, msg.durationMs);
    } catch (e) { return; }
    if (role === 'elder') renderElderVoice();
    else syncPlaybackUi();
  } catch (e) {
    console.warn(e);
    stopPlaying();
    toast(t('toastVoiceFailed'));
  }
};

// Time simulation in cloud mode: rewind last_check_in on server, then sweep
const _simulateHoursLocal = simulateHours;
simulateHours = async function(h) {
  if (!cloud || !cloudReady) return _simulateHoursLocal(h);
  const elder = getActiveElder();
  if (!elder) return;
  const last = elder.lastCheckIn || Date.now();
  const iso = new Date(last - h * 3600000).toISOString();
  try {
    await cloud.setLastCheckIn(elder.id, iso, 1);
    if (typeof cloud.sweepMyHouseholdMissed === 'function') {
      await cloud.sweepMyHouseholdMissed();
    } else if (PRESK_CONFIG.mode === 'mock') {
      await fetch((PRESK_CONFIG.mockUrl || 'http://127.0.0.1:8787') + '/rpc/sweep_missed_checkins', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    }
    await pullCloudState();
    const newest = (state.notifications || [])[0];
    if (newest && (newest.kind || '').startsWith('care')) browserNotify('Presok', newest.message);
    toast(t('toastSim') + h + t('hours'));
  } catch (e) {
    console.warn(e);
    toast(t('cloudError'));
  }
};

const _resetDemoTimeLocal = resetDemoTime;
resetDemoTime = async function() {
  if (!cloud || !cloudReady) return _resetDemoTimeLocal();
  const elder = getActiveElder();
  if (!elder) return;
  try {
    await cloud.setLastCheckIn(elder.id, new Date().toISOString(), 1);
    await pullCloudState();
    toast(t('toastTimeReset'));
  } catch (e) { toast(t('cloudError')); }
};

const _resetDemoDataLocal = resetDemoData;
resetDemoData = async function() {
  if (!cloud || !cloudReady) {
    if (!confirm(t('confirmReset'))) return;
    return _resetDemoDataLocal();
  }
  if (!confirm(t('pairSignOut') + '?')) return;
  try {
    cloud.signOut();
  } catch (e) {}
  cloudReady = false;
  try { resetMsgChimeKnown(); } catch (e) {}
  location.reload();
};

// Family People tab: add-parent first; big pairing codes only after seniors exist
const _renderFamilyLocal = renderFamily;
renderFamily = function() {
  _renderFamilyLocal();
  const addCard = document.getElementById('addElderCard');
  const panel = document.getElementById('pairingPanel');
  const host = document.getElementById('tabElders');
  const empty = !state.elders.length;

  if (host) {
    host.classList.add('family-people');
    host.classList.toggle('has-seniors', !empty);
  }
  if (addCard) {
    addCard.classList.toggle('primary-setup', empty);
  }

  const hint = document.getElementById('familyHint');
  if (hint && role === 'family') {
    if (empty) {
      hint.classList.add('hidden');
    } else {
      hint.classList.remove('hidden');
      hint.textContent = t('familyHint');
    }
  }

  // Soften empty list when form is already the CTA
  const list = document.getElementById('elderList');
  if (list && empty && role === 'family') {
    list.innerHTML = '';
  }

  if (!panel) return;
  if (!(cloud && cloudReady) || role !== 'family' || familyTab !== 'elders') {
    panel.classList.add('hidden');
    panel.innerHTML = '';
    return;
  }

  if (empty) {
    // Never show senior-side "ask your family" copy on the family phone
    panel.classList.add('hidden');
    panel.innerHTML = '';
    return;
  }

  panel.classList.remove('hidden');
  panel.innerHTML = state.elders.map(e => {
    const code = e.pairingCode || '——————';
    return (
      '<div class="card pair-setup-card" style="margin-bottom:12px" data-elder-pair="' + e.id + '">' +
        '<h2>' + escapeHtml(t('pairAfterAddTitle')) + '</h2>' +
        '<p class="muted" style="margin-bottom:4px"><strong>' + escapeHtml(elderTitle(e)) + '</strong></p>' +
        '<p class="muted">' + escapeHtml(t('pairFamilyHelp')) + '</p>' +
        '<div class="pair-code-big" aria-label="' + escapeHtml(t('pairShowCode')) + '">' + escapeHtml(code) + '</div>' +
        '<div class="share-row">' +
          '<button type="button" class="btn btn-primary" data-share-pair="' + e.id + '" data-code="' + escapeHtml(code) + '">' + escapeHtml(t('pairShareBtn')) + '</button>' +
          '<button type="button" class="btn btn-secondary" data-refresh-pair="' + e.id + '">' + escapeHtml(t('pairRefreshCode')) + '</button>' +
        '</div>' +
      '</div>'
    );
  }).join('');

  panel.querySelectorAll('[data-refresh-pair]').forEach(btn => {
    btn.onclick = () => refreshPairCode(btn.getAttribute('data-refresh-pair'));
  });
  panel.querySelectorAll('[data-share-pair]').forEach(btn => {
    btn.onclick = () => sharePairCode(btn.getAttribute('data-code'), btn);
  });
};

async function sharePairCode(code, btn) {
  const text = t('pairShareText').replace('{code}', code || '');
  try {
    if (navigator.share) {
      await navigator.share({ title: 'Presok', text: text });
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
  }
  try {
    await navigator.clipboard.writeText(text);
    if (btn) {
      const prev = btn.textContent;
      btn.textContent = t('pairCopiedBtn');
      setTimeout(() => { btn.textContent = prev; }, 1600);
    } else {
      toast(t('pairCopiedBtn'));
    }
  } catch (e2) {
    toast(code || t('cloudError'));
  }
}
if (window.PresokApp) window.PresokApp.sharePairCode = sharePairCode;

};

// Replace original boot: don't render until gate decided
// Original calls render() at end — we intercept by re-running boot

bindVoiceControls();
bindSosHold();

setInterval(() => {
  if (!_bootDone) return;
  if (role === 'elder') renderElder();
  else if (familyTab === 'elders' || familyTab === 'alerts' || familyTab === 'messages') renderFamily();
  else if (familyTab === 'medicine') renderMedicineTab();
  updateSimClock();
  try { maybeSweepMissedForFamily(); } catch (e) {}
  try { updateMedOverlay(); } catch (e) {}
}, 15000);

// Start: try cloud session, else show gate (local demo still available)
bootCloud().catch(err => {
  console.warn(err);
  showPairGate('choose');
});
